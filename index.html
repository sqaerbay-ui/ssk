<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>资源搜索</title>
<style>
:root{
  --bg:#f6f8fa; --card:#fff; --border:#d8dee4;
  --text:#1f2328; --text-secondary:#59636e; --text-muted:#8b949e;
  --accent:#0969da; --accent-bg:#ddf4ff; --hover:#f3f4f6;
  --mark-bg:#fff8c5; --mark-text:#4d2d00;
  --shadow:0 1px 3px rgba(31,35,40,.06),0 1px 2px rgba(31,35,40,.04);
  --radius:10px;
}
[data-theme="dark"]{
  --bg:#0d1117; --card:#161b22; --border:#30363d;
  --text:#e6edf3; --text-secondary:#9198a1; --text-muted:#6e7681;
  --accent:#4493f8; --accent-bg:#121d2f; --hover:#1c2128;
  --mark-bg:#9e6a03; --mark-text:#fff8c5;
  --shadow:0 1px 3px rgba(0,0,0,.3);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;
  min-height:100vh;-webkit-font-smoothing:antialiased;
}

/* 头部 */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(246,248,250,.85);
  backdrop-filter:saturate(180%) blur(12px);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--border);
}
[data-theme="dark"] .header{background:rgba(13,17,23,.85)}
.header-inner{max-width:820px;margin:0 auto;padding:16px 20px 12px}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-size:17px;font-weight:600;letter-spacing:-.01em}
.header-actions{display:flex;align-items:center;gap:10px}
.count{font-size:12px;color:var(--text-muted)}
.theme-toggle{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.theme-toggle:hover{background:var(--hover)}

/* 搜索框 */
.search-box{position:relative;display:flex;align-items:center}
.search-icon{
  position:absolute;left:14px;width:17px;height:17px;
  color:var(--text-muted);pointer-events:none;
}
#searchInput{
  width:100%;padding:12px 42px;border:1px solid var(--border);
  border-radius:var(--radius);background:var(--card);
  font-size:14px;font-family:inherit;color:var(--text);
  outline:none;transition:border-color .15s,box-shadow .15s;
}
#searchInput:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
#searchInput::placeholder{color:var(--text-muted)}
.clear-btn{
  position:absolute;right:10px;width:22px;height:22px;border-radius:50%;
  border:none;background:var(--text-muted);color:var(--card);
  cursor:pointer;font-size:14px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  opacity:.6;transition:opacity .15s;
}
.clear-btn:hover{opacity:1}

/* 分类标签 */
.categories{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cat-tag{
  padding:3px 11px;border-radius:20px;border:1px solid var(--border);
  background:var(--card);font-size:12px;color:var(--text-secondary);
  cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit;
}
.cat-tag:hover{border-color:var(--accent);color:var(--accent)}
.cat-tag.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* 结果列表 */
.main{max-width:820px;margin:0 auto;padding:16px 20px 60px}
.results{display:flex;flex-direction:column;gap:8px}
.result-item{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 16px;
  transition:border-color .15s,box-shadow .15s;
}
.result-item:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.result-name{
  font-size:14px;font-weight:500;color:var(--text);
  word-break:break-all;line-height:1.5;margin-bottom:6px;
}
.result-link-row{display:flex;align-items:center;gap:8px}
.result-link{
  font-size:12px;color:var(--accent);text-decoration:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
}
.result-link:hover{text-decoration:underline}
.copy-btn{
  flex-shrink:0;padding:3px 10px;font-size:11px;border-radius:5px;
  border:1px solid var(--border);background:transparent;
  color:var(--text-secondary);cursor:pointer;font-family:inherit;
  transition:all .15s;
}
.copy-btn:hover{background:var(--hover);color:var(--text);border-color:var(--accent);color:var(--accent)}
.result-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{
  font-size:11px;color:var(--text-secondary);background:var(--bg);
  padding:1px 8px;border-radius:4px;border:1px solid var(--border);
}
.tag.cat{color:var(--accent);background:var(--accent-bg);border-color:transparent}
mark{background:var(--mark-bg);color:var(--mark-text);padding:0 1px;border-radius:2px}

/* 空状态 & 加载更多 */
.empty{text-align:center;padding:70px 20px;color:var(--text-muted)}
.empty-icon{font-size:38px;margin-bottom:14px;opacity:.5}
.empty p{font-size:14px;margin-bottom:4px}
.empty-hint{font-size:12px!important;opacity:.7}
.load-more-wrap{text-align:center;margin-top:18px}
.load-more{
  padding:9px 26px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--text-secondary);font-size:13px;
  cursor:pointer;font-family:inherit;transition:all .15s;
}
.load-more:hover{border-color:var(--accent);color:var(--accent)}

/* Toast */
.toast{
  position:fixed;bottom:32px;left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);
  padding:8px 18px;border-radius:8px;font-size:13px;
  opacity:0;pointer-events:none;transition:all .25s;z-index:999;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 移动端 */
@media (max-width:640px){
  .header-inner,.main{padding-left:14px;padding-right:14px}
  .result-item{padding:12px 14px}
  .logo{font-size:16px}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-top">
      <h1 class="logo">资源搜索</h1>
      <div class="header-actions">
        <span class="count" id="totalCount">—</span>
        <button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>
      </div>
    </div>
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="搜索资源名称、分类或标签..." autocomplete="off" spellcheck="false">
      <button class="clear-btn" id="clearBtn" hidden>×</button>
    </div>
    <div class="categories" id="categories"></div>
  </div>
</header>

<main class="main">
  <div class="results" id="results"></div>
  <div class="load-more-wrap">
    <button class="load-more" id="loadMore" hidden>显示更多</button>
  </div>
  <div class="empty" id="empty" hidden>
    <div class="empty-icon">🔍</div>
    <p>没有找到匹配的资源</p>
    <p class="empty-hint">试试换个关键词或减少筛选条件</p>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
/* ====================================================
   ① 数据区 —— 把你的 Excel 转成 JSON 后替换这里
   格式：
   {
     "name": "资源名称",
     "link": "资源链接",
     "category": "分类",
     "tags": ["标签1", "标签2"],
     "date": "2025-01-01"
   }
   ==================================================== */
const DATA = [
  {
    "name": "示例：某某游戏整合包",
    "link": "https://pan.baidu.com/s/xxxxx",
    "category": "游戏",
    "tags": ["PC", "单机", "整合"],
    "date": "2025-01-01"
  },
  {
    "name": "示例：某某软件工具合集",
    "link": "https://pan.baidu.com/s/yyyyy",
    "category": "软件",
    "tags": ["Windows", "工具"],
    "date": "2025-01-02"
  }
];
/* ==================================================== */

const PAGE_SIZE = 50;
const state = { query: '', category: '', shown: PAGE_SIZE };

const $ = id => document.getElementById(id);
const searchInput = $('searchInput');
const clearBtn    = $('clearBtn');
const categoriesEl= $('categories');
const resultsEl   = $('results');
const emptyEl     = $('empty');
const loadMoreBtn = $('loadMore');
const totalCountEl= $('totalCount');
const themeToggle = $('themeToggle');
const toastEl     = $('toast');

/* ---------- 工具函数 ---------- */
function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function highlight(text, query){
  text = String(text || '');
  if(!query) return escapeHtml(text);
  const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
  if(!terms.length) return escapeHtml(text);

  const lowerText = text.toLowerCase();
  const ranges = [];
  for(const term of terms){
    let idx = 0;
    while((idx = lowerText.indexOf(term, idx)) !== -1){
      ranges.push([idx, idx + term.length]);
      idx += term.length;
      if(ranges.length > 100) break;
    }
  }
  if(!ranges.length) return escapeHtml(text);

  ranges.sort((a,b)=>a[0]-b[0]);
  const merged = [];
  for(const r of ranges){
    const last = merged[merged.length-1];
    if(last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
    else merged.push([...r]);
  }

  let out = '', pos = 0;
  for(const [s,e] of merged){
    out += escapeHtml(text.slice(pos, s));
    out += '<mark>' + escapeHtml(text.slice(s, e)) + '</mark>';
    pos = e;
  }
  out += escapeHtml(text.slice(pos));
  return out;
}

function debounce(fn, ms){
  let timer;
  return function(...args){
    clearTimeout(timer);
    timer = setTimeout(()=>fn.apply(this,args), ms);
  };
}

/* ---------- 分类标签 ---------- */
function buildCategories(){
  const cats = new Map();
  for(const item of DATA){
    const c = (item.category||'').trim();
    if(c) cats.set(c, (cats.get(c)||0)+1);
  }
  const sorted = [...cats.entries()].sort((a,b)=>b[1]-a[1]);
  categoriesEl.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'cat-tag active';
  all.textContent = `全部 (${DATA.length})`;
  all.dataset.cat = '';
  categoriesEl.appendChild(all);
  for(const [cat,count] of sorted){
    const t = document.createElement('button');
    t.className = 'cat-tag';
    t.textContent = `${cat} (${count})`;
    t.dataset.cat = cat;
    categoriesEl.appendChild(t);
  }
}

/* ---------- 过滤 ---------- */
function filterData(){
  const q = state.query.trim().toLowerCase();
  const terms = q.split(/\s+/).filter(Boolean);
  const cat = state.category;
  return DATA.filter(item=>{
    if(cat && (item.category||'') !== cat) return false;
    if(!terms.length) return true;
    const hay = [
      item.name||'',
      item.category||'',
      (item.tags||[]).join(' '),
      item.link||''
    ].join(' ').toLowerCase();
    return terms.every(t=>hay.includes(t));
  });
}

/* ---------- 渲染 ---------- */
function render(){
  if(!DATA.length){
    resultsEl.innerHTML = '';
    emptyEl.hidden = false;
    emptyEl.querySelector('p').textContent = '还没有数据';
    emptyEl.querySelector('.empty-hint').textContent = '请在代码的 DATA 数组里填入资源';
    loadMoreBtn.hidden = true;
    totalCountEl.textContent = '0 条';
    return;
  }

  const filtered = filterData();
  const toShow = filtered.slice(0, state.shown);

  totalCountEl.textContent = filtered.length === DATA.length
    ? `共 ${DATA.length} 条`
    : `${filtered.length} / ${DATA.length} 条`;

  if(!filtered.length){
    resultsEl.innerHTML = '';
    emptyEl.hidden = false;
    emptyEl.querySelector('p').textContent = '没有找到匹配的资源';
    emptyEl.querySelector('.empty-hint').textContent = '试试换个关键词或减少筛选条件';
    loadMoreBtn.hidden = true;
    return;
  }
  emptyEl.hidden = true;

  resultsEl.innerHTML = toShow.map(item=>{
    const nameHtml = highlight(item.name, state.query.trim());
    const cat  = item.category ? `<span class="tag cat">${escapeHtml(item.category)}</span>` : '';
    const tags = (item.tags||[]).slice(0,6).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('');
    const date = item.date ? `<span class="tag">${escapeHtml(item.date)}</span>` : '';
    const link = item.link || '';
    const linkRow = link
      ? `<div class="result-link-row">
           <a class="result-link" href="${escapeHtml(link)}" target="_blank" rel="noopener" title="${escapeHtml(link)}">${escapeHtml(link)}</a>
           <button class="copy-btn" data-link="${escapeHtml(link)}">复制</button>
         </div>`
      : '';
    return `
      <div class="result-item">
        <div class="result-name">${nameHtml}</div>
        ${linkRow}
        ${(cat||tags||date) ? `<div class="result-meta">${cat}${tags}${date}</div>` : ''}
      </div>
    `;
  }).join('');

  if(filtered.length > state.shown){
    loadMoreBtn.hidden = false;
    loadMoreBtn.textContent = `显示更多（还有 ${filtered.length - state.shown} 条）`;
  }else{
    loadMoreBtn.hidden = true;
  }
}

/* ---------- 事件 ---------- */
const onSearch = debounce(v=>{
  state.query = v;
  state.shown = PAGE_SIZE;
  render();
}, 150);

searchInput.addEventListener('input', e=>{
  const v = e.target.value;
  clearBtn.hidden = !v;
  onSearch(v);
});

clearBtn.addEventListener('click', ()=>{
  searchInput.value = '';
  clearBtn.hidden = true;
  state.query = '';
  state.shown = PAGE_SIZE;
  render();
  searchInput.focus();
});

categoriesEl.addEventListener('click', e=>{
  const tag = e.target.closest('.cat-tag');
  if(!tag) return;
  categoriesEl.querySelectorAll('.cat-tag').forEach(t=>t.classList.remove('active'));
  tag.classList.add('active');
  state.category = tag.dataset.cat;
  state.shown = PAGE_SIZE;
  render();
});

loadMoreBtn.addEventListener('click', ()=>{
  state.shown += PAGE_SIZE;
  render();
});

resultsEl.addEventListener('click', e=>{
  const btn = e.target.closest('.copy-btn');
  if(!btn) return;
  const link = btn.dataset.link;
  if(!link) return;
  const done = ()=>{
    showToast('已复制链接');
    const old = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(()=>btn.textContent = old, 1200);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(link).then(done).catch(()=>{
      const ta = document.createElement('textarea');
      ta.value = link; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy');
      document.body.removeChild(ta); done();
    });
  }else{
    const ta = document.createElement('textarea');
    ta.value = link; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta); done();
  }
});

/* 主题 */
const savedTheme = localStorage.getItem('theme');
if(savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)){
  document.documentElement.setAttribute('data-theme','dark');
  themeToggle.textContent = '☀️';
}
themeToggle.addEventListener('click', ()=>{
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if(isDark){
    document.documentElement.removeAttribute('data-theme');
    themeToggle.textContent = '🌙';
    localStorage.setItem('theme','light');
  }else{
    document.documentElement.setAttribute('data-theme','dark');
    themeToggle.textContent = '☀️';
    localStorage.setItem('theme','dark');
  }
});

/* Toast */
let toastTimer;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 1500);
}

/* 键盘快捷键 */
document.addEventListener('keydown', e=>{
  if(e.key === '/' && document.activeElement !== searchInput){
    e.preventDefault();
    searchInput.focus();
  }
  if(e.key === 'Escape' && document.activeElement === searchInput){
    searchInput.value = '';
    clearBtn.hidden = true;
    state.query = '';
    render();
  }
});

/* 启动 */
buildCategories();
render();
</script>
</body>
</html>
