<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>资源搜索</title>
<style>
:root{
  --bg:#f6f8fa; --card:#fff; --border:#d8dee4;
  --text:#1f2328; --text-secondary:#59636e; --text-muted:#8b949e;
  --accent:#0969da; --accent-bg:#ddf4ff; --hover:#f3f4f6;
  --mark-bg:#fff8c5; --mark-text:#4d2d00;
  --shadow:0 1px 3px rgba(31,35,40,.06);
  --radius:10px;
}
[data-theme="dark"]{
  --bg:#0d1117; --card:#161b22; --border:#30363d;
  --text:#e6edf3; --text-secondary:#9198a1; --text-muted:#6e7681;
  --accent:#4493f8; --accent-bg:#121d2f; --hover:#1c2128;
  --mark-bg:#9e6a03; --mark-text:#fff8c5;
  --shadow:0 1px 3px rgba(0,0,0,.3);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;
  min-height:100vh;
}
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(246,248,250,.85);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--border);
}
[data-theme="dark"] .header{background:rgba(13,17,23,.85)}
.header-inner{max-width:820px;margin:0 auto;padding:16px 20px 12px}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-size:17px;font-weight:600}
.header-actions{display:flex;align-items:center;gap:10px}
.count{font-size:12px;color:var(--text-muted)}
.theme-toggle{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;
}
.search-box{position:relative;display:flex;align-items:center}
.search-icon{
  position:absolute;left:14px;width:17px;height:17px;
  color:var(--text-muted);pointer-events:none;
}
#searchInput{
  width:100%;padding:12px 42px;border:1px solid var(--border);
  border-radius:var(--radius);background:var(--card);
  font-size:14px;font-family:inherit;color:var(--text);
  outline:none;
}
#searchInput:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.clear-btn{
  position:absolute;right:10px;width:22px;height:22px;border-radius:50%;
  border:none;background:var(--text-muted);color:var(--card);
  cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;
  opacity:.6;
}
.clear-btn:hover{opacity:1}
.main{max-width:820px;margin:0 auto;padding:16px 20px 60px}
.results{display:flex;flex-direction:column;gap:8px}
.result-item{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px 16px;
  transition:border-color .15s,box-shadow .15s;
}
.result-item:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.result-name{
  font-size:14px;font-weight:500;color:var(--text);
  word-break:break-all;line-height:1.5;margin-bottom:6px;
}
.result-link-row{display:flex;align-items:center;gap:8px}
.result-link{
  font-size:12px;color:var(--accent);text-decoration:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
}
.result-link:hover{text-decoration:underline}
.copy-btn{
  flex-shrink:0;padding:3px 10px;font-size:11px;border-radius:5px;
  border:1px solid var(--border);background:transparent;
  color:var(--text-secondary);cursor:pointer;font-family:inherit;
}
.copy-btn:hover{background:var(--hover);color:var(--accent);border-color:var(--accent)}
mark{background:var(--mark-bg);color:var(--mark-text);padding:0 1px;border-radius:2px}
.empty{text-align:center;padding:70px 20px;color:var(--text-muted)}
.empty-icon{font-size:38px;margin-bottom:14px;opacity:.5}
.load-more-wrap{text-align:center;margin-top:18px}
.load-more{
  padding:9px 26px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--text-secondary);font-size:13px;
  cursor:pointer;font-family:inherit;
}
.load-more:hover{border-color:var(--accent);color:var(--accent)}
.toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);padding:8px 18px;border-radius:8px;
  font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:999;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:640px){
  .header-inner,.main{padding-left:14px;padding-right:14px}
  .result-item{padding:12px 14px}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-top">
      <h1 class="logo">资源搜索</h1>
      <div class="header-actions">
        <span class="count" id="totalCount">加载中...</span>
        <button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>
      </div>
    </div>
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="输入资源名称搜索..." autocomplete="off" spellcheck="false">
      <button class="clear-btn" id="clearBtn" hidden>×</button>
    </div>
  </div>
</header>

<main class="main">
  <div class="results" id="results"></div>
  <div class="load-more-wrap">
    <button class="load-more" id="loadMore" hidden>显示更多</button>
  </div>
  <div class="empty" id="empty" hidden>
    <div class="empty-icon" id="emptyIcon">🔍</div>
    <p id="emptyTitle">没有找到匹配的资源</p>
    <p id="emptyDesc" style="font-size:12px;opacity:.7">试试换个关键词</p>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   资源搜索逻辑：读取同目录下的 data.json，默认不显示列表
   ============================================================ */
const DATA_URL = 'data.json';
const PAGE_SIZE = 50;

let DATA = [];
const state = { query: '', shown: PAGE_SIZE };

const $ = id => document.getElementById(id);
const searchInput = $('searchInput');
const clearBtn = $('clearBtn');
const resultsEl = $('results');
const emptyEl = $('empty');
const emptyIcon = $('emptyIcon');
const emptyTitle = $('emptyTitle');
const emptyDesc = $('emptyDesc');
const loadMoreBtn = $('loadMore');
const totalCountEl = $('totalCount');
const themeToggle = $('themeToggle');
const toastEl = $('toast');

function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function highlight(text, query){
  text = String(text || '');
  if(!query) return escapeHtml(text);
  const terms = query.toLowerCase().split(/\s+/).filter(Boolean);
  if(!terms.length) return escapeHtml(text);
  const lowerText = text.toLowerCase();
  const ranges = [];
  for(const term of terms){
    let idx = 0;
    while((idx = lowerText.indexOf(term, idx)) !== -1){
      ranges.push([idx, idx + term.length]);
      idx += term.length;
      if(ranges.length > 100) break;
    }
  }
  if(!ranges.length) return escapeHtml(text);
  ranges.sort((a,b)=>a[0]-b[0]);
  const merged = [];
  for(const r of ranges){
    const last = merged[merged.length-1];
    if(last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
    else merged.push([...r]);
  }
  let out = '', pos = 0;
  for(const [s,e] of merged){
    out += escapeHtml(text.slice(pos, s));
    out += '<mark>' + escapeHtml(text.slice(s, e)) + '</mark>';
    pos = e;
  }
  out += escapeHtml(text.slice(pos));
  return out;
}

function debounce(fn, ms){
  let timer;
  return function(...args){
    clearTimeout(timer);
    timer = setTimeout(()=>fn.apply(this,args), ms);
  };
}

async function loadData(){
  try {
    const res = await fetch(DATA_URL);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if(!Array.isArray(json)) throw new Error('数据格式错误，必须是数组');
    DATA = json;
    render();
  } catch (err) {
    console.error('数据加载失败:', err);
    resultsEl.innerHTML = `
      <div class="empty" style="display:block">
        <div class="empty-icon">⚠️</div>
        <p>数据加载失败</p>
        <p style="font-size:12px;opacity:.7">请检查 data.json 是否存在且格式正确</p>
      </div>
    `;
    totalCountEl.textContent = '加载失败';
  }
}

function filterData(){
  const q = state.query.trim().toLowerCase();
  if(!q) return [];
  const terms = q.split(/\s+/).filter(Boolean);
  return DATA.filter(item=>{
    const hay = (item.name||'').toLowerCase();
    return terms.every(t=>hay.includes(t));
  });
}

function render(){
  if(!DATA.length){
    emptyEl.hidden = false;
    emptyIcon.textContent = '⚠️';
    emptyTitle.textContent = 'data.json 里没有数据';
    emptyDesc.textContent = '';
    totalCountEl.textContent = '0 条';
    loadMoreBtn.hidden = true;
    return;
  }

  const q = state.query.trim();
  // 没有搜索词时：不显示列表，只显示提示
  if(!q){
    resultsEl.innerHTML = '';
    emptyEl.hidden = false;
    emptyIcon.textContent = '🔍';
    emptyTitle.textContent = '输入关键词开始搜索';
    emptyDesc.textContent = '支持按资源名称模糊搜索';
    loadMoreBtn.hidden = true;
    totalCountEl.textContent = `共 ${DATA.length} 条资源`;
    return;
  }

  const filtered = filterData();
  const toShow = filtered.slice(0, state.shown);

  totalCountEl.textContent = filtered.length === DATA.length
    ? `共 ${DATA.length} 条`
    : `${filtered.length} / ${DATA.length} 条`;

  if(!filtered.length){
    resultsEl.innerHTML = '';
    emptyEl.hidden = false;
    emptyIcon.textContent = '🔍';
    emptyTitle.textContent = '没有找到匹配的资源';
    emptyDesc.textContent = '试试换个关键词';
    loadMoreBtn.hidden = true;
    return;
  }

  emptyEl.hidden = true;
  resultsEl.innerHTML = toShow.map(item=>{
    const nameHtml = highlight(item.name, q);
    const link = item.link || '';
    return `
      <div class="result-item">
        <div class="result-name">${nameHtml}</div>
        <div class="result-link-row">
          <a class="result-link" href="${escapeHtml(link)}" target="_blank" rel="noopener">${escapeHtml(link)}</a>
          <button class="copy-btn" data-link="${escapeHtml(link)}">复制</button>
        </div>
      </div>
    `;
  }).join('');

  if(filtered.length > state.shown){
    loadMoreBtn.hidden = false;
    loadMoreBtn.textContent = `显示更多（还有 ${filtered.length - state.shown} 条）`;
  }else{
    loadMoreBtn.hidden = true;
  }
}

const onSearch = debounce(v=>{
  state.query = v;
  state.shown = PAGE_SIZE;
  render();
}, 150);

searchInput.addEventListener('input', e=>{
  const v = e.target.value;
  clearBtn.hidden = !v;
  onSearch(v);
});

clearBtn.addEventListener('click', ()=>{
  searchInput.value = '';
  clearBtn.hidden = true;
  state.query = '';
  state.shown = PAGE_SIZE;
  render();
  searchInput.focus();
});

loadMoreBtn.addEventListener('click', ()=>{
  state.shown += PAGE_SIZE;
  render();
});

resultsEl.addEventListener('click', e=>{
  const btn = e.target.closest('.copy-btn');
  if(!btn) return;
  const link = btn.dataset.link;
  if(!link) return;
  const done = ()=>{
    toastEl.textContent = '已复制链接';
    toastEl.classList.add('show');
    setTimeout(()=>toastEl.classList.remove('show'), 1500);
    const old = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(()=>btn.textContent = old, 1200);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(link).then(done).catch(()=>{
      fallbackCopy(link); done();
    });
  }else{
    fallbackCopy(link); done();
  }
});

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta);
  ta.select(); document.execCommand('copy');
  document.body.removeChild(ta);
}

const savedTheme = localStorage.getItem('theme');
if(savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)){
  document.documentElement.setAttribute('data-theme','dark');
  themeToggle.textContent = '☀️';
}
themeToggle.addEventListener('click', ()=>{
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if(isDark){
    document.documentElement.removeAttribute('data-theme');
    themeToggle.textContent = '🌙';
    localStorage.setItem('theme','light');
  }else{
    document.documentElement.setAttribute('data-theme','dark');
    themeToggle.textContent = '☀️';
    localStorage.setItem('theme','dark');
  }
});

document.addEventListener('keydown', e=>{
  if(e.key === '/' && document.activeElement !== searchInput){
    e.preventDefault();
    searchInput.focus();
  }
  if(e.key === 'Escape' && document.activeElement === searchInput){
    searchInput.value = '';
    clearBtn.hidden = true;
    state.query = '';
    render();
  }
});

loadData();
</script>
</body>
</html>
